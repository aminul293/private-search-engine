<html><head><title>Missions to Mars</title></head><body><h1>Missions to Mars</h1><p>Mars is the most explored planet beyond Earth. Rovers have driven across the Mars surface studying rocks and searching for signs of past water. A trip to Mars takes about seven months. Future missions hope to bring Mars samples home and one day send people.</p><nav><a href="space-rockets.html">space-rockets.html</a></nav></body></html>
